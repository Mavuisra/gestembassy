# Frontend React (SPA) — Netlify
# Ce fichier est dans le répertoire de base Netlify (frontend/),
# donc les chemins ci-dessous sont relatifs à frontend/.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Remplacer l’URL Render après le premier déploiement API.
# Sans proxy : définir VITE_API_BASE=https://VOTRE-API.onrender.com/api/v1 dans l’UI Netlify.

[[redirects]]
  from = "/api/*"
  to = "https://gestembassy.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

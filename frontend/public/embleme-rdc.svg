<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img" aria-label="Emblème de la République démocratique du Congo">
  <!-- Représentation institutionnelle simplifiée de l'emblème RDC — à remplacer par le fichier officiel fourni par l'Ambassade -->
  <rect width="200" height="240" fill="#007FFF"/>
  <circle cx="100" cy="88" r="42" fill="#F7D618" stroke="#0a0a0a" stroke-width="2"/>
  <!-- Tête de léopard stylisée -->
  <ellipse cx="100" cy="82" rx="28" ry="24" fill="#C4A35A"/>
  <ellipse cx="88" cy="78" rx="5" ry="6" fill="#1a1a1a"/>
  <ellipse cx="112" cy="78" rx="5" ry="6" fill="#1a1a1a"/>
  <path d="M90 92 Q100 100 110 92" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M72 70 L78 58 L86 68" fill="#C4A35A" stroke="#1a1a1a" stroke-width="1"/>
  <path d="M128 70 L122 58 L114 68" fill="#C4A35A" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Défenses -->
  <path d="M55 120 Q40 150 70 175" fill="none" stroke="#F7D618" stroke-width="8" stroke-linecap="square"/>
  <path d="M145 120 Q160 150 130 175" fill="none" stroke="#F7D618" stroke-width="8" stroke-linecap="square"/>
  <!-- Lance -->
  <line x1="100" y1="130" x2="100" y2="200" stroke="#CE1126" stroke-width="4"/>
  <polygon points="100,120 94,132 106,132" fill="#CE1126"/>
  <!-- Devise -->
  <rect x="20" y="205" width="160" height="22" fill="#0a0a0a"/>
  <text x="100" y="220" text-anchor="middle" fill="#F7D618" font-family="Source Sans 3, sans-serif" font-size="11" font-weight="700">JUSTICE • PAIX • TRAVAIL</text>
</svg>

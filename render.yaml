# Blueprint Render — API Django (test) avec SQLite
# Pas de Postgres : supprimer DATABASE_URL dans l’Environment Render s’il existe.

services:
  - type: web
    name: gestembassy-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # SQLite : 1 worker. wsgi.py re-bootstrap si tables manquantes (startCommand dashboard obsolète).
    # Ne PAS définir DATABASE_URL. Si le Start Command UI diffère, coller la ligne ci-dessous.
    startCommand: python manage.py migrate --noinput && python manage.py seed_public_content && python manage.py seed_staff && python manage.py verify_db && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: gestembassy.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://drcembassyseoul.netlify.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://drcembassyseoul.netlify.app
      - key: PUBLIC_APP_URL
        value: https://drcembassyseoul.netlify.app
      - key: EXPOSE_API_DOCS
        value: "False"
      - key: NOTIFICATION_CHANNELS
        value: in_app,email
      - key: NOTIFICATIONS_EMAIL_ENABLED
        value: "true"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
